name: Watchlist — daily job fetch + score

on:
  schedule:
    # 14:00 UTC = 7:00 AM Pacific (PDT) / 6:00 AM (PST).
    # Runs an hour after the discovery workflow (expand.yml, 6 AM PT) so newly
    # discovered companies are already in Supabase when this scores.
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  fetch-and-score:
    name: Fetch jobs + score with Claude
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install httpx

      - name: Run pipeline
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_and_score.py
