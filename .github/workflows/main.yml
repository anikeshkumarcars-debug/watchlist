name: Watchlist — daily job fetch + score

# MANUAL ONLY — there is no cron here by design. This runs when you click
# "Run workflow", never on a schedule, so nothing is ever billed to the
# Anthropic account without an explicit click.
#
# To restore the daily schedule, add back:
#   schedule:
#     - cron: "0 14 * * *"    # 7 AM Pacific
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch + filter only — no Claude calls, no DB writes (free)"
        type: boolean
        default: true
      max_companies:
        description: "Cap companies processed (0 = all). Use a small number for a quick smoke test."
        type: string
        default: "0"
      first_run_days:
        description: "Back-catalog window for companies seen for the FIRST time. Use ~180 for the initial backfill, then leave at 7."
        type: string
        default: "7"
      lookback_hours:
        description: "How far back to look for companies already in the DB. Make this longer than the gap between your manual runs (168 = 1 week, 720 = 30 days)."
        type: string
        default: "168"

jobs:
  fetch-and-score:
    name: Fetch jobs + score with Claude
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install httpx

      - name: Run pipeline
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          # Manual-only workflow, so inputs are always present — no need to
          # guard on github.event_name the way a cron-triggered run would.
          DRY_RUN:               ${{ inputs.dry_run }}
          MAX_COMPANIES:         ${{ inputs.max_companies }}
          FIRST_RUN_DAYS:        ${{ inputs.first_run_days }}
          LOOKBACK_HOURS:        ${{ inputs.lookback_hours }}
        run: python scripts/fetch_and_score.py
